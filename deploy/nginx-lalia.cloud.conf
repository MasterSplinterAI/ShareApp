# Production vhost for lalia.cloud.
# Same app checkout and backend as the former staging host.
# Cert is issued after DNS points here:
#   sudo certbot --nginx -d lalia.cloud -d www.lalia.cloud
# Do not enable the 443 servers until /etc/letsencrypt/live/lalia.cloud/ exists.

server {
    listen 80;
    listen [::]:80;
    server_name lalia.cloud www.lalia.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://lalia.cloud$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.lalia.cloud;

    ssl_certificate /etc/letsencrypt/live/lalia.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lalia.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://lalia.cloud$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lalia.cloud;

    ssl_certificate /etc/letsencrypt/live/lalia.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lalia.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/share-app-staging/livekit-app/frontend;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml application/wasm application/octet-stream;

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        return 200 "User-agent: *\nAllow: /\n\nDisallow: /v2/app/\nDisallow: /room/\nDisallow: /join/\n\nSitemap: https://lalia.cloud/sitemap.xml\n";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /mediapipe/ {
        expires 7d;
        access_log off;
        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types application/wasm application/javascript application/octet-stream;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /api {
        proxy_pass http://localhost:3101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /rtc {
        resolver 127.0.0.53 8.8.8.8 valid=30s ipv6=off;
        resolver_timeout 5s;
        set $livekit_upstream "production-uiycx4ku.livekit.cloud";
        proxy_pass https://$livekit_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host production-uiycx4ku.livekit.cloud;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
