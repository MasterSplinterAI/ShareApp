# Retired product host. Keep the name only as a redirect so old links land on Lalia.
# The legacy app process and /var/www/share-app checkout are no longer served.

server {
    listen 80;
    listen [::]:80;
    server_name share.jarmetals.com;
    return 301 https://lalia.cloud$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name share.jarmetals.com;

    ssl_certificate /etc/letsencrypt/live/share.jarmetals.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/share.jarmetals.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://lalia.cloud$request_uri;
}
