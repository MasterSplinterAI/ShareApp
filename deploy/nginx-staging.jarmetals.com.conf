# Staging vhost for staging.jarmetals.com (reference + deploy target).
# Live server: /etc/nginx/sites-enabled/staging.jarmetals.com (or equivalent).
# HTML must not be cached so SPA picks up new hashed JS/CSS after each deploy.

server {
    server_name staging.jarmetals.com;

    root /var/www/share-app-staging/livekit-app/frontend;
    index index.html;

    # Staging must never enter Google — repeat on locations that set add_header
    # (nginx does not inherit parent add_header into those blocks).
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~ ^/preview/blog(/.*)?$ {
        return 301 https://$host/blog$1;
    }

    location ~ ^/preview(/.*)?$ {
        return 301 https://$host/;
    }

    # English has no locale prefix — /en and /en/... canonicalize to unprefixed URLs.
    location = /en {
        return 301 https://$host/;
    }
    location = /en/ {
        return 301 https://$host/;
    }
    location ~ ^/en/(.*)$ {
        return 301 https://$host/$1;
    }

    # Long cache for hashed build assets (Vite outputs content-hashed filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|mp3)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
        try_files $uri =404;
    }

    # MediaPipe segmentation runtime (~9MB wasm + models). ^~ so the regex above
    # can't grab the .js loader. Not content-hashed → 7-day cache (not immutable),
    # gzip cuts the wasm ~4x. Without this block these fell into `location /`
    # with no-store and re-downloaded 9MB on every visit.
    location ^~ /mediapipe/ {
        expires 7d;
        access_log off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types application/wasm application/javascript application/octet-stream;
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ^~ /marketing {
        proxy_pass http://localhost:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
    }

    location ^~ /blog {
        try_files $uri $uri/index.html @marketing_blog;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location @marketing_blog {
        proxy_pass http://localhost:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml @marketing_sitemap;
        default_type application/xml;
        add_header Cache-Control "public, max-age=900" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location @marketing_sitemap {
        proxy_pass http://localhost:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Prefer prerendered route shells (e.g. /demo/index.html) without a 301 trailing-slash redirect
        try_files $uri $uri/index.html /app-index.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /api {
        proxy_pass http://localhost:3101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /rtc {
        resolver 127.0.0.53 8.8.8.8 valid=30s ipv6=off;
        resolver_timeout 5s;
        set $livekit_upstream "production-uiycx4ku.livekit.cloud";
        proxy_pass https://$livekit_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host production-uiycx4ku.livekit.cloud;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/staging.jarmetals.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.jarmetals.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = staging.jarmetals.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name staging.jarmetals.com;
    return 404;
}
