<div class="lp-preview" data-page="{{PAGE}}" role="region" aria-label="Design preview controls">
  <span class="lp-preview-tag"><i></i>Preview</span>
  <nav class="lp-preview-pages" aria-label="Preview pages"><a href="/preview/home" data-route="/preview/home">Home</a><a href="/preview/blog" data-route="/preview/blog">Blog</a></nav>
  <span class="lp-preview-label" id="lp-palette-label">Theme</span>
  <div class="lp-preview-switch" role="group" aria-labelledby="lp-palette-label">
    <button type="button" data-palette-set="blue" aria-pressed="false"><span class="lp-swatch lp-swatch-blue"></span>Lalia Blue</button>
    <button type="button" data-palette-set="green" aria-pressed="false"><span class="lp-swatch lp-swatch-green"></span>Original Green</button>
  </div>
  <button type="button" class="lp-preview-close" aria-label="Hide preview bar" title="Hide (press P to show)">&times;</button>
</div>
