<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #ffffff;
        color: #0f172a;
        position: relative;
        overflow: hidden;
      }
      .glow {
        position: absolute;
        top: -320px;
        left: 50%;
        transform: translateX(-50%);
        width: 1100px;
        height: 700px;
        background: radial-gradient(ellipse 60% 55% at 50% 50%, rgba(37, 99, 235, 0.14), transparent 70%);
        pointer-events: none;
      }
      .frame {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
      }
      .brand { display: flex; align-items: center; gap: 16px; }
      .mark {
        width: 56px; height: 56px; border-radius: 14px;
        background: #2563eb; color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-size: 30px; font-weight: 800; letter-spacing: -0.03em;
      }
      .wordmark { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
      .eyebrow {
        font-size: 17px; font-weight: 600; letter-spacing: 0.22em;
        text-transform: uppercase; color: #2563eb; margin-bottom: 22px;
      }
      h1 {
        font-size: 68px; font-weight: 700; line-height: 1.04;
        letter-spacing: -0.03em; max-width: 900px;
      }
      .sub { margin-top: 26px; font-size: 26px; color: #475569; font-weight: 500; }
      .chips { display: flex; gap: 14px; }
      .chip {
        font-size: 20px; font-weight: 600; color: #334155;
        background: #f1f5f9; border: 1px solid #e2e8f0;
        padding: 12px 22px; border-radius: 999px;
      }
      .domain { font-size: 22px; font-weight: 600; color: #64748b; }
      .foot { display: flex; align-items: center; justify-content: space-between; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="frame">
      <div class="brand">
        <div class="mark">L</div>
        <div class="wordmark">Lalia</div>
      </div>
      <div>
        <div class="eyebrow">Live captions &amp; translation</div>
        <h1>Video meetings everyone can follow&mdash;in their own language.</h1>
        <p class="sub">Real-time translation, live captions, and one-click guest links.</p>
      </div>
      <div class="foot">
        <div class="chips">
          <div class="chip">Real-time translation</div>
          <div class="chip">Live captions</div>
          <div class="chip">Guest links</div>
        </div>
        <div class="domain">lalia.cloud</div>
      </div>
    </div>
  </body>
</html>
