    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://lalia.cloud/#organization",
            "name": "Lalia",
            "url": "https://lalia.cloud/",
            "email": "hello@lalia.cloud"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://lalia.cloud/#software",
            "name": "Lalia",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "description": "Video meetings with live captions and real-time translation for global teams.",
            "publisher": { "@id": "https://lalia.cloud/#organization" }
          },
          {
            "@type": "FAQPage",
            "@id": "https://lalia.cloud/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Do guests need an account?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Hosts share a guest join URL and invite token when required. Guests enter a display name and join in the browser."
                }
              },
              {
                "@type": "Question",
                "name": "Which languages are supported?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Lalia supports 30+ meeting languages for live captions and cross-language translation."
                }
              },
              {
                "@type": "Question",
                "name": "Are meetings recorded?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Audio and video are not recorded. Optional transcript text is stored only when the host enables it for a meeting."
                }
              },
              {
                "@type": "Question",
                "name": "Do you use my meetings to train AI models?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Lalia does not use meeting content to train its own models. Providers process data under contract to operate the service."
                }
              }
            ]
          }
        ]
      }
    </script>
